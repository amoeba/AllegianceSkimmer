name: Build

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Cache Decal MSI
        id: cache-decal-msi
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.decal-msi/Decal.msi
          # Key derives from the pinned MSI URL/hash in
          # AllegianceSkimmer/scripts/decal-deps.json so the cache rotates
          # automatically when the pin changes.
          key: decal-msi-${{ hashFiles('AllegianceSkimmer/scripts/decal-deps.json') }}

      - name: Acquire Decal deps
        shell: pwsh
        run: ./AllegianceSkimmer/scripts/acquire-decal-deps.ps1 -MSIFile "${{ github.workspace }}/.decal-msi/Decal.msi"

      - name: Restore NuGet packages
        run: nuget restore AllegianceSkimmer.sln

      - name: Build (Debug)
        run: msbuild AllegianceSkimmer.sln /p:Configuration=Debug /p:Platform="Any CPU"

      - name: Test
        run: dotnet test AllegianceSkimmer.Tests/AllegianceSkimmer.Tests.csproj --no-build -c Debug