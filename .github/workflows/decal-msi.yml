name: Decal MSI Contents

# Exploratory workflow: download https://www.decaldev.com/releases/2983/Decal.msi,
# extract it, and list what's inside. Used to figure out how to replace the
# vendored deps/Decal.*.dll files with a cached download of the MSI.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download Decal.msi
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\Decal.msi"
          Invoke-WebRequest -Uri "https://www.decaldev.com/releases/2983/Decal.msi" -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          Write-Host "Size: $((Get-Item $msi).Length) bytes"
          Write-Host "SHA256: $hash"
          # Pinned hash for this build of the MSI:
          Write-Host "Expected: 101365BA4378BE20D9AB57BA9F1C1DEDA5F93BB1B7BDB511DA836C9A69A31F26"

      - name: Extract MSI (administrative install)
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\Decal.msi"
          $dest = "$env:RUNNER_TEMP\decal-extracted"
          $log = "$env:RUNNER_TEMP\decal-msi.log"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $p = Start-Process msiexec -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$dest`" /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 50
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: List extracted contents
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\decal-extracted"
          Get-ChildItem -Path $dest -Recurse -File |
            Sort-Object FullName |
            Select-Object FullName, Length |
            Format-Table -AutoSize